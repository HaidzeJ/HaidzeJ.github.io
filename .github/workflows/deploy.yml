name: Deploy to GitHub Pages

on:
  # Run on every push to master, plus a manual "Run workflow" button in the Actions tab
  push:
    branches: [master]
  workflow_dispatch:

# Minimum access: read the code, publish to Pages, and prove identity to GitHub
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Install, build, and upload the site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
